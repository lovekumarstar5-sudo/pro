 <html>
   <style type="text/css" media="all">
  body{
    padding:0;

   align-items:center;}
     #btn{
       font-size:17px;
       border-radius:15px;
       background-color:#C6CCB2;
       color:#874000;
       border:none;
       font-weight:bold;
       height:20%;
       width:35%;
       /* padding:10px 14px; */
     }
     .container{
       overflow:auto;
       height:40vh;
       width:30vw;
       border:0.5px solid yellowgreen;
       border-radius:10px;
       display:flex;
       flex-direction:column;
       align-items:center;
       justify-content:space-evenly;
     background-image:url("/images/hacker.jpg");
   background-size:cover;
   background-position:center;
box-shadow:0 0px 30px rgba(0,255,0,0.9);
animation:hide 5s linear;
     }
     @keyframes hide{
       0%{opacity:0}
       50%{opacity:0.5}
       100%{opacity:1}
     }
     #show{
       color:greenyellow;
       margin:0px auto;
       padding:0;
font-size:20px;
     } 
     #hack{
       z-index:-1;
       height:100vh;
       width:100vw;
     }
     .head{
       font-size:50px;
       font-family:sans-serif;
       color:#00FF00;
     font-weight:bold;
     text-shadow:0 0 15px #00ff00,
                0 0 20px #00ff00;
     }
     
     #jetha{
       background-color:#E9ECEF;
box-shadow:2px 2px 15px yellowgreen;   
       width:60%;
       height:20%;
       font-size:17px;
       padding:2px 7px;
       border-radius:10px;
       border:none;
     }
   </style>
 <body>
<h1 class="head">Password Cracker</h1>
   <div class="container">
<input type="text" name="" id="jetha" maxlength= "8" placeholder="Enter eight digit password">
   <button type="submit" id = "btn">Check Password</button>
   <p id = "show"></p>
   </div>
   <script type="text/javascript" charset="utf-8"> 
   let show = document.getElementById("show");
   let input = document.getElementById("jetha")
   document.getElementById("btn").addEventListener("click",check)
   function check(){ 
     let password = "12345678";
     //ya Number(input.value)
   let val = input.value;
     if(val === password){
       show.innerText = "Hacker Walt Is Opening..."
   }else{
     show.innerText = "Incorrect Password"
   }
   input.value = ""
   }
   </script>
 </body>
 </html>
